<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shipit board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #0a0c10; --panel: #0f1218; --card: #151922; --card-hi: #1b2030; --line: #222836;
  --text: #e7ebf3; --muted: #8a93a6; --faint: #566074;
  --done: #3fb950; --blocked: #ff6b6b; --next: #5cc8ff; --agent: #b388ff; --accent: #3fb950;
  --bug: #ff6b6b; --feature: #b388ff; --infra: #ffb454; --core: #5cc8ff; --chore: #9aa4b8;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 14px/1.5 Inter, "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased; min-height: 100vh; padding: 28px 36px 120px;
  background: radial-gradient(1200px 500px at 15% -10%, rgba(92,200,255,.06), transparent 60%),
              radial-gradient(900px 400px at 100% 0%, rgba(179,136,255,.05), transparent 60%), var(--bg);
}

/* Header */
.top { display: flex; align-items: center; gap: 24px; margin-bottom: 22px; }
.brand { display: flex; align-items: center; gap: 12px; }
.logo { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
  background: linear-gradient(135deg, #5cc8ff, #b388ff); box-shadow: 0 6px 20px rgba(92,200,255,.25); }
.name { font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
.repo { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.badge { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 99px;
  background: rgba(179,136,255,.14); color: var(--agent); }
.team { display: flex; margin-left: auto; padding-left: 10px; }
.team .avatar { width: 32px; height: 32px; margin-left: -10px; border: 2px solid var(--bg);
  transition: transform .2s var(--ease); }
.team .avatar:hover { transform: translateY(-3px); z-index: 1; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px 7px 12px;
  border-radius: 99px; background: var(--panel); border: 1px solid var(--line);
  font-weight: 600; font-size: 13px; transition: color .3s, border-color .3s; min-width: 116px; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.pill[data-state=listening] { color: #ffb454; border-color: rgba(255,180,84,.35); }
.pill[data-state=listening] .dot { background: #ffb454; animation: beat 1.2s infinite; }
.pill[data-state=parsing] { color: var(--agent); border-color: rgba(179,136,255,.35); }
.pill[data-state=parsing] .dot { background: var(--agent); animation: beat .6s infinite; }
.pill[data-state=ready] { color: var(--done); border-color: rgba(63,185,80,.35); }
.pill[data-state=ready] .dot { background: var(--done); }
.pill[data-state=offline] { color: var(--muted); }
@keyframes beat { 0%,100% { box-shadow: 0 0 0 0 currentColor; } 50% { box-shadow: 0 0 0 5px transparent; } }

/* What was said */
.said-strip { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 18px; margin-bottom: 22px; box-shadow: var(--shadow); }
.said-strip .label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--faint); }
.transcript { margin: 4px 0 0; color: #c9d1e0; font-size: 15px; min-height: 22px; }
.transcript.empty { color: var(--faint); font-style: italic; }
.transcript .w { opacity: 0; animation: word .25s var(--ease) forwards; }
@keyframes word { from { opacity: 0; filter: blur(3px); } to { opacity: 1; filter: none; } }

/* Board */
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; align-items: start; }
@media (max-width: 1150px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { body { padding: 18px 16px 150px; } .board { grid-template-columns: 1fr; }
  .top { flex-wrap: wrap; } }
.col { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px;
  min-height: 220px; }
.col > header { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px;
  letter-spacing: .02em; padding: 2px 4px 12px; }
.col > header .cdot { width: 8px; height: 8px; border-radius: 3px; background: var(--c); }
.col > header .count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums;
  background: var(--card); border-radius: 99px; padding: 0 9px; font-size: 12px; }
.cards { display: flex; flex-direction: column; gap: 12px; min-height: 40px; }
.cards:empty::before { content: attr(data-empty); color: var(--faint); font-size: 13px;
  border: 1px dashed var(--line); border-radius: 12px; padding: 18px; text-align: center; }

/* Card */
.card { background: linear-gradient(180deg, var(--card-hi), var(--card)); border: 1px solid var(--line);
  border-radius: 13px; padding: 13px 14px 12px; box-shadow: var(--shadow); position: relative;
  overflow: hidden; }
.card.entering { animation: enter .5s var(--ease) both; }
.card::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px;
  border-radius: 0 3px 3px 0; background: var(--c, var(--line)); opacity: .9; }
@keyframes enter { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
.card-top { display: flex; align-items: flex-start; gap: 10px; }
.title { font-size: 15px; font-weight: 600; line-height: 1.35; margin: 0; flex: 1; letter-spacing: -.005em;
  background: linear-gradient(var(--blocked), var(--blocked)) no-repeat 0 55% / 0 2px;
  transition: background-size .45s var(--ease), color .3s; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600;
  padding: 2px 9px; border-radius: 99px; background: rgba(255,255,255,.05); color: var(--muted); }
.chip svg { width: 12px; height: 12px; }
.chip.lbl { color: var(--lc); background: color-mix(in srgb, var(--lc) 14%, transparent); }
.said { margin: 9px 0 0; color: var(--muted); font-style: italic; font-size: 13px; line-height: 1.45; }
.said.commit { font-style: normal; font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
  font-size: 12px; color: var(--faint); }
.note { margin-top: 7px; font-size: 12px; color: var(--agent); display: flex; gap: 6px; }
.note:empty { display: none; }

/* Avatars */
.avatar { width: 28px; height: 28px; border-radius: 50%; flex: none; overflow: hidden; display: grid;
  place-items: center; font-size: 11px; font-weight: 700; color: #0a0c10; background: var(--h, #5cc8ff);
  box-shadow: 0 0 0 2px var(--card-hi); }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.none { background: var(--card); color: var(--faint); border: 1px dashed var(--line); box-shadow: none; }
.flip { animation: flip .55s var(--ease); }
@keyframes flip { 0% { transform: rotateY(0); } 50% { transform: rotateY(90deg); } 100% { transform: rotateY(0); } }

/* Corrections */
.pulse { animation: pulse .9s var(--ease) 2; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,180,84,0); transform: none; }
  40% { box-shadow: 0 0 0 4px rgba(255,180,84,.25); transform: scale(1.08); color: #ffb454; } }
.card.scratched .title { background-size: 100% 2px; color: var(--muted); }
.card.shake { animation: shake .45s ease-in-out; }
@keyframes shake { 0%,100% { transform: none; } 20% { transform: translateX(-6px) rotate(-.6deg); }
  40% { transform: translateX(6px) rotate(.6deg); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.card.gone { transition: opacity .5s, transform .5s var(--ease), max-height .45s .25s, padding .45s .25s,
  margin .45s .25s, border-width .45s .25s; opacity: 0; transform: scale(.96); max-height: 0 !important;
  padding-top: 0; padding-bottom: 0; margin-bottom: -12px; border-width: 0; }
.card.glow { box-shadow: 0 0 0 1px rgba(179,136,255,.5), 0 8px 30px rgba(179,136,255,.18); }

/* Receipt */
.receipt { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 36px; display: flex;
  align-items: center; gap: 26px; flex-wrap: wrap; background: rgba(10,12,16,.82);
  backdrop-filter: blur(12px); border-top: 1px solid var(--line); font-size: 13px; color: var(--muted);
  transform: translateY(100%); transition: transform .6s var(--ease); }
.receipt.show { transform: none; }
.receipt .head { font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
.receipt b { color: var(--text); font-size: 18px; font-variant-numeric: tabular-nums; margin-right: 4px; }
.receipt .saved b { color: var(--accent); font-size: 24px; }
.receipt .saved { color: var(--text); }
.receipt .spacer { margin-left: auto; }
@media (prefers-reduced-motion: reduce) { *, *::before { animation-duration: .01s !important; transition-duration: .01s !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a0c10" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></div>
    <div><div class="name">Shipit</div><div class="repo"><span id="repo">connecting…</span><span id="replay" class="badge" hidden>Replay</span></div></div>
  </div>
  <div class="team" id="team"></div>
  <div class="pill" id="pill" data-state="offline"><span class="dot"></span><span id="pillText">Connecting</span></div>
</header>

<section class="said-strip">
  <div class="label">You said</div>
  <p class="transcript empty" id="transcript">Waiting for your standup…</p>
</section>

<main class="board">
  <section class="col" style="--c: var(--done)"><header><span class="cdot"></span>Done<span class="count" data-count="done">0</span></header><div class="cards" data-col="done" data-empty="Nothing shipped yet"></div></section>
  <section class="col" style="--c: var(--blocked)"><header><span class="cdot"></span>Blocked<span class="count" data-count="blocked">0</span></header><div class="cards" data-col="blocked" data-empty="Nothing blocked"></div></section>
  <section class="col" style="--c: var(--next)"><header><span class="cdot"></span>Next<span class="count" data-count="next">0</span></header><div class="cards" data-col="next" data-empty="Nothing planned yet"></div></section>
  <section class="col" style="--c: var(--agent)"><header><span class="cdot"></span>Agent<span class="count" data-count="agent">0</span></header><div class="cards" data-col="agent" data-empty="Run with --agent N to hand next issues to Claude Code"></div></section>
</main>

<footer class="receipt" id="receipt">
  <span class="head"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>Receipt</span>
  <span><b data-n="items">0</b>items</span>
  <span><b data-n="assigned">0</b>assigned</span>
  <span><b data-n="words">0</b>words</span>
  <span><b data-n="spoken" data-min>0</b>min spoken</span>
  <span><b data-n="typed" data-min>0</b>min to type</span>
  <span class="saved"><b data-n="saved" data-min>0</b>min saved</span>
  <span class="spacer" id="total"></span>
</footer>

<script>
const $ = (s, el = document) => el.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const LABEL = { bug: "--bug", feature: "--feature", infra: "--infra", core: "--core", chore: "--chore" };
const COL = { done: "--done", blocked: "--blocked", next: "--next", agent: "--agent" };
const ICON = {
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  dep: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4v9a4 4 0 0 0 4 4h9"/><path d="M16 13l4 4-4 4"/></svg>',
  undo: '↺',
};
let team = {}, items = new Map(), totalSaved = 0;

/* Events run one at a time so cards arrive in order with their animations. */
const queue = [];
let busy = false;
async function drain() {
  busy = true;
  while (queue.length) { try { await queue.shift()(); } catch (e) { console.error(e); } }
  busy = false;
}
function enqueue(fn) { queue.push(fn); if (!busy) drain(); }

const es = new EventSource("/events");
for (const kind of ["reset", "meta", "status", "transcript", "item", "receipt"]) {
  es.addEventListener(kind, e => enqueue(() => on[kind](JSON.parse(e.data))));
}
let lastState = "offline";
es.onerror = () => setTimeout(() => es.readyState !== EventSource.OPEN && pill("offline", false), 2000);
es.onopen = () => pill(lastState);

const on = {
  reset() {
    items = new Map();
    document.querySelectorAll(".cards").forEach(c => c.replaceChildren());
    setTranscript("");
    $("#receipt").classList.remove("show");
    counts();
  },
  meta(m) {
    $("#repo").textContent = m.repo;
    $("#replay").hidden = !m.replay;
    team = Object.fromEntries(m.team.map(p => [p.login, p]));
    team.__me = m.me;
    $("#team").replaceChildren(...m.team.slice(0, 7).map(p => avatar(p.login)));
  },
  status(s) { pill(s); },
  async transcript(text) {
    setTranscript(text);
    await sleep(Math.min(2600, text.split(/\s+/).length * 35) + 300);
  },
  async item(i) {
    if (items.has(i.id)) return;
    const card = render(start(i));
    items.set(i.id, { item: start(i), card });
    $(`[data-col="${start(i).section}"]`).append(card);
    counts(); deps();
    await sleep(260);
    if (i.changes.length || i.scratched) await sleep(450);
    for (const c of i.changes) await change(i.id, c);
    if (i.scratched) await scratch(i.id);
  },
  receipt(r) {
    $("#receipt").classList.add("show");
    totalSaved += r.saved_s;
    const values = { items: r.items, assigned: r.assigned, words: r.words,
      spoken: r.spoken_s / 60, typed: r.typed_s / 60, saved: r.saved_s / 60 };
    // Not awaited: background tabs pause animation frames and must not stall the queue.
    Object.entries(values).forEach(([k, v]) => countUp($(`[data-n="${k}"]`), v));
    $("#total").textContent = `${(totalSaved / 60).toFixed(1)} min saved this session`;
  },
};

function pill(state, remember = true) {
  if (remember) lastState = state;
  const text = { listening: "Listening", parsing: "Parsing", ready: "Ready", offline: "Offline" };
  $("#pill").dataset.state = state;
  $("#pillText").textContent = text[state] || state;
}

function setTranscript(text) {
  const el = $("#transcript");
  el.classList.toggle("empty", !text);
  if (!text) { el.textContent = "Waiting for your standup…"; return; }
  el.replaceChildren(...text.split(/(\s+)/).map((w, n) => {
    const s = document.createElement("span");
    s.textContent = w;
    if (w.trim()) { s.className = "w"; s.style.animationDelay = `${Math.min(n * 17, 2500)}ms`; }
    return s;
  }));
}

/* The item as first spoken: undo its corrections so we can replay them on screen. */
function start(i) {
  const first = { ...i, scratched: false };
  for (const c of [...i.changes].reverse()) if (c.field in first) first[c.field] = c.from;
  return first;
}

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }

function due(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
}

function avatar(login) {
  const el = document.createElement("div");
  el.className = "avatar";
  el.title = login ? "@" + login : "Unassigned";
  if (!login) { el.classList.add("none"); el.textContent = "?"; return el; }
  const person = team[login];
  const initials = (person?.name || login).split(/[\s\-_]+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
  let hue = 0; for (const ch of login) hue = (hue * 31 + ch.charCodeAt(0)) % 360;
  el.style.setProperty("--h", `hsl(${hue} 70% 68%)`);
  el.textContent = initials;
  if (person?.avatar) {
    const img = new Image();
    img.alt = ""; img.src = person.avatar;
    img.onload = () => el.replaceChildren(img);
  }
  return el;
}

function render(i) {
  const card = document.createElement("article");
  card.className = "card entering";
  card.addEventListener("animationend", e => e.animationName === "enter" && card.classList.remove("entering"));
  card.dataset.id = i.id;
  card.style.setProperty("--c", `var(${COL[i.section]})`);
  const commit = /^commit [0-9a-f]{7,}$/.test(i.said);
  card.innerHTML = `
    <div class="card-top"><h3 class="title"></h3></div>
    <div class="chips">
      <span class="chip lbl" style="--lc: var(${LABEL[i.label] || "--core"})">${esc(i.label)}</span>
      <span class="chip due" ${i.deadline ? "" : "hidden"}>${ICON.cal}<span>${due(i.deadline)}</span></span>
      ${i.depends_on.map(d => `<span class="chip dep" data-dep="${esc(d)}">${ICON.dep}<span>after ${esc(d)}</span></span>`).join("")}
    </div>
    <p class="said ${commit ? "commit" : ""}">${commit ? esc(i.said) : `“${esc(i.said)}”`}</p>
    <div class="note"></div>`;
  $(".title", card).textContent = i.title;
  $(".card-top", card).append(avatar(i.assignee));
  return card;
}

function deps() {
  document.querySelectorAll(".chip.dep").forEach(chip => {
    const target = items.get(chip.dataset.dep);
    if (target) $("span", chip).textContent = "after " + target.item.title;
  });
}

function counts() {
  for (const col of Object.keys(COL)) {
    const n = document.querySelectorAll(`[data-col="${col}"] .card:not(.scratched)`).length;
    $(`[data-count="${col}"]`).textContent = n;
  }
}

async function change(id, c) {
  const { item, card } = items.get(id);
  item[c.field] = c.to;
  $(".note", card).innerHTML = `<span>${ICON.undo}</span><span>${esc(c.said || c.field + " changed")}</span>`;
  card.classList.add("glow");
  if (c.field === "assignee") {
    const old = $(".card-top .avatar", card);
    old.classList.add("flip");
    await sleep(260);
    const fresh = avatar(c.to);
    fresh.classList.add("flip");
    old.replaceWith(fresh);
    await sleep(400);
  } else if (c.field === "deadline") {
    const chip = $(".chip.due", card);
    chip.hidden = !c.to;
    $("span", chip).textContent = due(c.to);
    chip.classList.remove("pulse"); void chip.offsetWidth; chip.classList.add("pulse");
    await sleep(900);
  } else if (c.field === "section" && COL[c.to]) {
    move(card, c.to);
    await sleep(700);
  } else if (c.field === "label" && LABEL[c.to]) {
    const chip = $(".chip.lbl", card);
    chip.style.setProperty("--lc", `var(${LABEL[c.to]})`);
    chip.textContent = c.to;
    chip.classList.add("pulse");
    await sleep(900);
  } else if (c.field === "title") {
    const t = $(".title", card);
    await t.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 180 }).finished;
    t.textContent = c.to;
    await t.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 240 }).finished;
    deps();
  }
  await sleep(350);
  card.classList.remove("glow");
}

/* FLIP: measure, move to the new column, animate from the old spot. */
function move(card, col) {
  const before = card.getBoundingClientRect();
  $(`[data-col="${col}"]`).append(card);
  card.style.setProperty("--c", `var(${COL[col]})`);
  const after = card.getBoundingClientRect();
  card.animate([{ transform: `translate(${before.left - after.left}px, ${before.top - after.top}px)` },
                { transform: "none" }], { duration: 650, easing: "cubic-bezier(.2,.8,.2,1)" });
  counts();
}

async function scratch(id) {
  const { card } = items.get(id);
  $(".note", card).innerHTML = `<span>✕</span><span>scratched</span>`;
  card.classList.add("scratched");
  counts();
  await sleep(450);
  card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
  await sleep(500);
  card.style.maxHeight = card.offsetHeight + "px";
  void card.offsetWidth;
  card.classList.add("gone");
  await sleep(750);
  card.remove();
}

function countUp(el, to) {
  const minutes = el.hasAttribute("data-min");
  const fmt = v => minutes ? v.toFixed(1) : Math.round(v).toString();
  return new Promise(done => {
    const t0 = performance.now(), ms = 1300;
    (function frame(now) {
      const p = Math.min(1, Math.max(0, (now - t0) / ms)), eased = 1 - Math.pow(1 - p, 3);
      el.textContent = fmt(to * eased);
      p < 1 ? requestAnimationFrame(frame) : done();
    })(t0);
  });
}
</script>
</body>
</html>
